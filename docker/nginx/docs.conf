# Swagger UI, dev stack only - it runs in its own container and serves openapi.yaml
# itself. Matched exactly, so only /docs/... goes there and any other path still
# answers with the API's own 404.
location = /docs {
    return 301 /docs/;
}

location ^~ /docs/ {
    proxy_pass http://swagger:8080;
    proxy_set_header Host $host;
}
