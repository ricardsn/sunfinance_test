; zend_extension is written by docker-php-ext-enable, don't repeat it here.
; Loaded as zz-xdebug.ini so these values win over the generated file.

; overridden by the XDEBUG_MODE env var in compose.override.yaml
xdebug.mode = debug,develop

; only start a session when XDEBUG_TRIGGER / ?XDEBUG_TRIGGER=1 is present,
; so normal requests and the test suite stay fast
xdebug.start_with_request = trigger

xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
xdebug.discover_client_host = off
xdebug.log_level = 0
