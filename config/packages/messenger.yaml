framework:
    messenger:
        failure_transport: failed

        transports:
            # doctrine://default - the queue table lives in the app database, so an
            # event and its job are committed together. The transport creates
            # messenger_messages itself on first use.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            # dead letter: nothing consumes this, messages wait here for a human
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ProcessFinancialEvent: async
