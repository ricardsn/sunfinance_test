framework:
    messenger:
        failure_transport: failed

        # JSON instead of PHP's serialize(): the body is then the message itself and the
        # stamps sit in the headers, so a queued row can be read in psql. The class name
        # becomes part of the stored format - renaming a message class breaks the rows
        # already in the queue.
        serializer:
            default_serializer: messenger.transport.symfony_serializer

        transports:
            # doctrine://default - the queue table lives in the app database, so an
            # event and its job are committed together. The transport creates
            # messenger_messages itself on first use.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            # dead letter: nothing consumes this, messages wait here for a human
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ProcessFinancialEvent: async

when@test:
    framework:
        messenger:
            transports:
                # a real queue for the retry / dead-letter test: the default async
                # transport is sync:// in tests, which never retries. delay: 0 keeps the
                # test off the 1s/2s/4s backoff, and use_notify: false stops the Postgres
                # transport from waiting on a LISTEN - the notification sits in the
                # test's own uncommitted transaction and would never arrive.
                queue_test:
                    dsn: 'doctrine://default?queue_name=queue_test'
                    options:
                        use_notify: false
                    retry_strategy:
                        max_retries: 3
                        delay: 0
